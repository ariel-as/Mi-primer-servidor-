
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Demo Flujo Cliente–Servidor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>Catálogo de Productos</h1>
  </header>

  <main>
    <!-- Sección del catálogo -->
    <section aria-labelledby="catTitulo">
      <h2 id="catTitulo">Productos disponibles</h2>

      <div id="catalogo" class="grid"></div>
    </section>

    <!-- Sección del carrito -->
    <section aria-labelledby="carTitulo">
      <h2 id="carTitulo">Carrito</h2>

      <ul id="carrito"></ul>

      <button id="enviar">Enviar pedido</button>

      <div
        id="status"
        aria-live="polite"
        class="status"
        role="status">
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
