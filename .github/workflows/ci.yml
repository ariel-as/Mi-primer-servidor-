name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            servidor-basico/package-lock.json
            servidor-basico1/package-lock.json
            demo-flujo/server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix servidor-basico
          npm ci --prefix servidor-basico1
          npm ci --prefix demo-flujo/server

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type d -name node_modules -prune -o -type f -name '*.js' -print)
          node --check .github/scripts/smoke-test.mjs

      - name: Run endpoint smoke tests
        run: node .github/scripts/smoke-test.mjs
